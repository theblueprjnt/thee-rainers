name: Smoke Suite

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: site

      - name: Run smoke suite
        run: npx playwright test --config tests/smoke/playwright.config.ts
        working-directory: site
        env:
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts-${{ github.sha }}
          path: |
            site/tests/smoke/artifacts/
          retention-days: 14

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=Smoke FAILED on ${{ github.sha }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Telegram alert failed (token may not be set)"
